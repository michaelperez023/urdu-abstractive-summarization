[project]
name = "urdu-headlines"
version = "0.1.0"
description = "Headline generation for Urdu news (XL-Sum) by fine-tuning mT5"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Michael Perez" },
    { name = "Mohammad Anas" },
    { name = "Ammar Amjad" },
]
dependencies = [
    "datasets>=3.6,<6",
    "huggingface-hub>=0.34,<3",
    "numpy>=1.26,<3",
    "protobuf>=4.25,<8",
    "rouge-score>=0.1.2,<0.2",
    "sentencepiece>=0.2,<0.3",
    "transformers>=5,<6",
]

[project.optional-dependencies]
train = [
    "accelerate>=1.10,<2",
    "torch>=2.6,<3",
]
notebook = [
    "jupyter>=1.1,<2",
    "matplotlib>=3.9,<4",
    "pandas>=2.2,<4",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.17,<0.18",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/urdu_headlines"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
